<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171918" />
    <title>LegiTech.io</title>
    <meta name="description" content="Custom software, websites, apps and automation, designed and built by LegiTech.io." />
    <!-- Share previews. Social crawlers don't run JavaScript, so these site-wide tags are what every shared link shows.
         Change the domain here if the site goes live somewhere else (see also public/robots.txt). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LegiTech.io" />
    <meta property="og:title" content="LegiTech.io | Complexity. Made simple." />
    <meta property="og:description" content="We turn ambitious ideas into websites, apps and software that move your business forward." />
    <meta property="og:url" content="https://legitech.io/" />
    <meta property="og:image" content="https://legitech.io/hero-sculpture.png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="LegiTech.io" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set theme before first paint so light-mode users don't see a dark flash.
      try {
        var t = localStorage.getItem('legitech-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
